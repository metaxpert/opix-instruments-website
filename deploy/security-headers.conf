# Included by EVERY location block below. nginx's add_header does not inherit
# into a location that declares its own add_header, so omitting this include
# silently drops all security headers for that location.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# TLS is terminated at Cloudflare; this instructs browsers to never try HTTP.
# No "preload" — that is effectively irreversible. The domain already sent HSTS
# under Hostinger, so this continues an existing commitment rather than making
# a new one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 'unsafe-inline' is REQUIRED by the current markup: 29 inline <script> blocks
# and 56 inline onerror="this.remove()" handlers on product images. It means
# this CSP does not stop inline-script XSS. What it does still buy: script and
# style cannot be loaded from an arbitrary third-party origin, <base> cannot be
# hijacked, plugins are dead, and the page cannot be framed off-site.
# To harden further, the inline scripts and handlers must be moved into
# assets/js/ first — then drop 'unsafe-inline' from script-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
