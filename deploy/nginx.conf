# Opix Instruments — user-space nginx serving the static site as the
# Cloudflare Tunnel origin. Runs unprivileged under this prefix; completely
# separate from the system nginx and its vhosts on :80.
#
#   start:  nginx -p ~/.local/opix-nginx -c ~/.local/opix-nginx/nginx.conf
#   reload: nginx -p ~/.local/opix-nginx -c ~/.local/opix-nginx/nginx.conf -s reload
#   stop:   nginx -p ~/.local/opix-nginx -c ~/.local/opix-nginx/nginx.conf -s stop

worker_processes auto;
pid   logs/nginx.pid;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path tmp/client;
  proxy_temp_path       tmp/proxy;
  fastcgi_temp_path     tmp/fastcgi;
  uwsgi_temp_path       tmp/uwsgi;
  scgi_temp_path        tmp/scgi;

  # Rate limit keyed on the REAL visitor IP (set_real_ip_from below rewrites
  # $binary_remote_addr from CF-Connecting-IP; without that every request would
  # share the 127.0.0.1 bucket and the limit would be useless).
  # Tuned generously: a catalog page fires ~60 image requests at once, so the
  # burst matters more than the rate. Raise or delete if it ever bites.
  limit_req_zone $binary_remote_addr zone=opix:10m rate=50r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=opixconn:10m;

  log_format tunnel '$remote_addr "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" cf=$http_cf_connecting_ip';
  access_log logs/access.log tunnel;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Static site: nothing is ever uploaded, and slow clients should not pin
  # workers on a machine that is also somebody's workstation.
  client_max_body_size 1k;
  client_body_timeout  10s;
  client_header_timeout 10s;
  send_timeout         30s;

  # 9,724 files, many small — keep connections warm for the tunnel.
  keepalive_timeout 65;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   5;
  gzip_proxied      any;
  gzip_types text/plain text/css text/xml application/javascript
             application/json application/xml application/manifest+json
             application/xhtml+xml image/svg+xml;
  # text/html is always gzipped by nginx and cannot be listed here. It matters
  # more than the rest: the pre-rendered dental section is 1.1 MB of HTML that
  # compresses to about 90 KB.

  server {
    listen      127.0.0.1:8091;
    server_name opixinst.com www.opixinst.com localhost;
    root        /home/metaxperts/opix/opix-instruments-website;
    index       index.html;

    # Real visitor IP comes through the tunnel in this header.
    real_ip_header    CF-Connecting-IP;
    set_real_ip_from  127.0.0.1;

    limit_req  zone=opix burst=200 nodelay;
    limit_conn opixconn 50;

    # A bare `return 301 /path` makes nginx build an absolute Location from
    # $scheme://$host:$server_port — and $server_port here is 8091, the port
    # the tunnel talks to. That leaked "http://www.opixinst.com:8091/..." to
    # the client. Relative Location headers are valid (RFC 7231) and sidestep
    # the whole class of problem, including nginx's own add-trailing-slash
    # redirects. Explicit absolute URLs in `return` are unaffected, so the
    # canonical host/scheme redirects below still work as written.
    absolute_redirect off;

    # ---- canonical host and scheme -------------------------------------
    # Before this, all four of these answered 200 with identical content:
    #   http://opixinst.com/   https://opixinst.com/
    #   https://www.opixinst.com/   https://www.opixinst.com/index.html
    # rel=canonical asks a crawler to consolidate them; a 301 tells it to.
    # Cloudflare terminates TLS and forwards the visitor's scheme in
    # X-Forwarded-Proto. "Always Use HTTPS" in the Cloudflare dashboard is the
    # more robust place for the scheme redirect — this is the origin's backstop.
    # $host is left alone for "localhost" so local health checks still work.
    if ($host = "opixinst.com")            { return 301 https://www.opixinst.com$request_uri; }
    if ($http_x_forwarded_proto = "http")  { return 301 https://www.opixinst.com$request_uri; }
    # Must test $request_uri, not a location. "index index.html" rewrites "/"
    # to "/index.html" INTERNALLY, so `location = /index.html` would catch the
    # homepage itself and 301 it back to "/" forever. $request_uri is the URI
    # the client actually sent and is untouched by the internal rewrite.
    if ($request_uri ~ "^/index\.html(\?|$)") { return 301 https://www.opixinst.com/; }

    # ---- retired category URLs ------------------------------------------
    # Four category pages were merged or relabelled after a data cleanup in
    # data/products.js (a mistranscribed page split, a misspelled duplicate,
    # and two mislabelled groups). They were live for about an hour and were
    # never in a submitted sitemap, so a crawler almost certainly never saw
    # them — these 301s just make certain. Safe to delete after a few months.
    location = /catalog-su-needle-holder.html                        { return 301 /catalog-su-needle-holders.html; }
    location = /catalog-dn-pliers-for-orthodontics-and-prostheties.html { return 301 /catalog-dn-pliers-for-orthodontics-and-prosthetics.html; }
    location = /catalog-dn-orthodontic-instruments.html              { return 301 /catalog-dn-calipers-and-measuring-gauges.html; }
    location = /catalog-bs-reamer.html                               { return 301 /catalog-bs.html#cat-bone-reamers; }

    # Static site — nothing here answers anything but a read.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Webfonts are self-hosted now — same-origin, immutable, and CORS-clean so
    # the <link rel=preload crossorigin> in every <head> actually hits.
    location ^~ /assets/fonts/ {
      include security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      add_header Access-Control-Allow-Origin "*" always;
      access_log off;
    }

    # Product photos and PDFs are filename-versioned — cache hard.
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
      include security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      access_log off;
    }
    location ~* \.pdf$ {
      include security-headers.conf;
      expires 30d;
      add_header Cache-Control "public" always;
    }

    # HTML and the catalog data must stay fresh — content updates ship in these.
    location ~* \.html$ {
      include security-headers.conf;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # Crawler-facing files must never be served stale.
    location ~* ^/(robots\.txt|sitemap.*\.xml|site\.webmanifest)$ {
      include security-headers.conf;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # data/ is the build's source, not a served asset. The catalogue pages no
    # longer fetch products.js — the products are pre-rendered into the HTML.
    location ^~ /data/ { return 404; }
    location ~* \.(css|js)$ {
      include security-headers.conf;
      expires 7d;
      add_header Cache-Control "public" always;
    }

    # Never serve repo/tooling files.
    location ~ /\.(git|htaccess) { return 404; }
    location ~* \.(py|md)$      { return 404; }
    location ^~ /tools/          { return 404; }

    include security-headers.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
      include security-headers.conf;
      try_files $uri $uri/ =404;
    }
  }
}
