# Included by EVERY location block below. nginx's add_header does not inherit
# into a location that declares its own add_header, so omitting this include
# silently drops all security headers for that location.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# TLS is terminated at Cloudflare; this instructs browsers to never try HTTP.
# No "preload" — that is effectively irreversible. The domain already sent HSTS
# under Hostinger, so this continues an existing commitment rather than making
# a new one.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# The SEO build removed every inline <script> block and all 56 inline onerror
# handlers (tools/seo/build.js resolves missing product photos at build time),
# and the webfonts are now self-hosted from /assets/fonts. That lets script-src
# drop 'unsafe-inline' entirely and the font/style directives drop Google.
#
# 'unsafe-inline' remains on style-src ONLY for the handful of inline style=""
# attributes still in the hand-written pages; removing those is the last step
# before this policy is fully strict.
#
# JSON-LD (<script type="application/ld+json">) is a data block, not executable
# script, so it is unaffected by the script-src tightening.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
